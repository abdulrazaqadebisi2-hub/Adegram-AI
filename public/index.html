<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Adegram AI</title>
  <script src="https://jsdelivr.net"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
    body { background: #131314; color: #e3e3e3; display: flex; flex-direction: column; height: 100dvh; }
    .banner { background: linear-gradient(90deg, #1a73e8, #8e24aa, #d81b60); color: #fff; text-align: center; font-size: 11px; padding: 5px; font-weight: 600; }
    header { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; border-bottom: 1px solid #333537; }
    .brand { font-size: 18px; font-weight: 700; background: linear-gradient(90deg, #4285f4, #d96570); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .btn { background: #1e1f20; color: #8ab4f8; border: 1px solid #333537; padding: 6px 12px; border-radius: 16px; font-size: 12px; cursor: pointer; }
    #chat { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 14px; max-width: 800px; width: 100%; margin: 0 auto; }
    .hero h1 { font-size: 26px; background: linear-gradient(90deg, #4285f4, #9b72cb, #d96570); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 6px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 14px; }
    .card { background: #1e1f20; border: 1px solid #333537; color: #e3e3e3; padding: 12px; border-radius: 12px; text-align: left; font-size: 13px; cursor: pointer; }
    .user { align-self: flex-end; background: #1e1f20; padding: 10px 14px; border-radius: 18px; max-width: 85%; line-height: 1.5; }
    .user img { max-width: 200px; border-radius: 10px; display: block; margin-bottom: 6px; }
    .ai { display: flex; gap: 10px; line-height: 1.6; }
    .ai-body { flex: 1; overflow-x: auto; }
    .ai-body pre { background: #0d0d0e; padding: 10px; border-radius: 8px; overflow-x: auto; margin: 8px 0; }
    .actions { display: flex; gap: 8px; margin-top: 6px; }
    .chip { background: #1e1f20; color: #9aa0a6; border: 1px solid #333537; border-radius: 12px; padding: 4px 10px; font-size: 12px; cursor: pointer; }
    .footer { padding: 10px 16px; max-width: 800px; width: 100%; margin: 0 auto; }
    #preview-box { display: none; align-items: center; gap: 8px; background: #1e1f20; padding: 6px 10px; border-radius: 12px; margin-bottom: 8px; width: fit-content; }
    #preview-box img { width: 45px; height: 45px; object-fit: cover; border-radius: 6px; }
    .bar { display: flex; align-items: center; background: #1e1f20; border: 1px solid #333537; border-radius: 26px; padding: 4px 8px; gap: 4px; }
    .icon { background: none; border: none; color: #e3e3e3; width: 36px; height: 36px; border-radius: 50%; cursor: pointer; font-size: 17px; }
    .recording { background: #d93025 !important; }
    #prompt { flex: 1; background: none; border: none; color: #fff; font-size: 15px; outline: none; padding: 8px; }
    .send { background: #8ab4f8; color: #131314; font-weight: bold; }
  </style>
</head>
<body>
  <div class="banner">Built by Sulaiman Abdul Razaq Adebisi • Offa, Kwara State • CEO Adegram Studio</div>
  <header>
    <div class="brand">✦ Adegram AI</div>
    <div>
      <button class="btn" onclick="location.reload()">+ New</button>
      <button class="btn" onclick="setName()">Name</button>
    </div>
  </header>

  <main id="chat">
    <div class="hero" id="hero">
      <h1 id="greet">Hello!</h1>
      <p style="color:#9aa0a6;font-size:14px;">Ask anything, upload a picture, or use voice.</p>
      <div class="grid">
        <button class="card" onclick="ask('Who built you and tell me about Adegram Studio?')">👤 Who built you?</button>
        <button class="card" onclick="ask('Who is Sulaiman Abdul Razaq Adebisi?')">⭐ About Sulaiman</button>
        <button class="card" onclick="ask('Write a business plan outline')">💼 Business plan</button>
        <button class="card" onclick="ask('Explain solar energy simply')">📚 Explain a topic</button>
      </div>
    </div>
  </main>

  <div class="footer">
    <div id="preview-box">
      <img id="preview-img" src="" />
      <button class="btn" onclick="clearImg()">✕</button>
    </div>
    <div class="bar">
      <input type="file" id="file" accept="image/*" hidden onchange="loadImg(event)" />
      <button class="icon" onclick="document.getElementById('file').click()">🖼️</button>
      <button class="icon" id="mic" onclick="toggleMic()">🎤</button>
      <input id="prompt" placeholder="Ask Adegram AI..." onkeydown="if(event.key==='Enter') send()" />
      <button class="icon send" onclick="send()">➤</button>
    </div>
  </div>

  <script>
    let userName = localStorage.getItem("adegram_user") || "Friend";
    let history = [], imgData = null, rec = null, listening = false;
    document.getElementById("greet").textContent = `Hello, ${userName}!`;

    function setName() {
      const n = prompt("Your name:", userName);
      if (n && n.trim()) { userName = n.trim(); localStorage.setItem("adegram_user", userName); document.getElementById("greet").textContent = `Hello, ${userName}!`; }
    }
    function ask(t) { document.getElementById("prompt").value = t; send(); }

    function loadImg(e) {
      const f = e.target.files[0]; if (!f) return;
      const r = new FileReader();
      r.onload = () => { imgData = { data: r.result.split(",")[1], mimeType: f.type, url: r.result }; document.getElementById("preview-img").src = r.result; document.getElementById("preview-box").style.display = "flex"; };
      r.readAsDataURL(f);
    }
    function clearImg() { imgData = null; document.getElementById("file").value = ""; document.getElementById("preview-box").style.display = "none"; }

    function toggleMic() {
      const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SR) return alert("Voice input not supported in this browser.");
      if (listening && rec) return rec.stop();
      rec = new SR(); rec.lang = "en-US";
      rec.onstart = () => { listening = true; document.getElementById("mic").classList.add("recording"); };
      rec.onresult = (e) => { document.getElementById("prompt").value += " " + e.results[0][0].transcript; };
      rec.onend = () => { listening = false; document.getElementById("mic").classList.remove("recording"); };
      rec.start();
    }

    function speak(text, btn) {
      if (speechSynthesis.speaking) { speechSynthesis.cancel(); btn.textContent = "🔊 Listen"; return; }
      const u = new SpeechSynthesisUtterance(text.replace(/[#*`_>-]/g, ""));
      u.onend = () => btn.textContent = "🔊 Listen";
      btn.textContent = "⏹️ Stop"; speechSynthesis.speak(u);
    }

    async function send() {
      const inp = document.getElementById("prompt"), text = inp.value.trim();
      if (!text && !imgData) return;
      const hero = document.getElementById("hero"); if (hero) hero.remove();
      const chat = document.getElementById("chat");

      const uDiv = document.createElement("div"); uDiv.className = "user";
      if (imgData) uDiv.innerHTML += `<img src="${imgData.url}">`;
      if (text) uDiv.appendChild(document.createTextNode(text));
      chat.appendChild(uDiv);

      const payloadImg = imgData ? { data: imgData.data, mimeType: imgData.mimeType } : null;
      inp.value = ""; clearImg();

      const load = document.createElement("div"); load.className = "ai"; load.innerHTML = `<span>✦</span><div style="color:#8ab4f8;">Thinking...</div>`;
      chat.appendChild(load); chat.scrollTop = chat.scrollHeight;

      try {
        const res = await fetch("/api/chat", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: text, image: payloadImg, history, userName })
        });
        const data = await res.json(); load.remove();
        const reply = data.reply || data.error || "No response.";
        if (data.reply) { history.push({ role: "user", text: text || "" }, { role: "model", text: reply }); }

        const aiDiv = document.createElement("div"); aiDiv.className = "ai";
        const body = document.createElement("div"); body.className = "ai-body";
        body.innerHTML = typeof marked !== "undefined" ? marked.parse(reply) : reply;

        const acts = document.createElement("div"); acts.className = "actions";
        const lBtn = document.createElement("button"); lBtn.className = "chip"; lBtn.textContent = "🔊 Listen"; lBtn.onclick = () => speak(reply, lBtn);
        const cBtn = document.createElement("button"); cBtn.className = "chip"; cBtn.textContent = "📋 Copy"; cBtn.onclick = () => { navigator.clipboard.writeText(reply); cBtn.textContent = "✅ Copied"; };
        acts.append(lBtn, cBtn); body.appendChild(acts);
        aiDiv.innerHTML = `<span>✦</span>`; aiDiv.appendChild(body);
        chat.appendChild(aiDiv); chat.scrollTop = chat.scrollHeight;
      } catch (err) { load.remove(); chat.innerHTML += `<div style="color:#f28b82;">Error: ${err.message}</div>`; }
    }
  </script>
</body>
</html>
